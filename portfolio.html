<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | ZOOM Studio</title>
    <style>
        body { background-color: #000000; margin: 0; padding: 0; font-family: 'Arial', sans-serif; color: #ffffff; overflow-x: hidden; }
        nav { position: fixed; top: 0; width: 100%; padding: 20px 0; text-align: center; background-color: rgba(10, 10, 10, 0.9); border-bottom: 1px solid #222222; z-index: 100; backdrop-filter: blur(10px); }
        .nav-links a { color: #ffffff; text-decoration: none; margin: 0 20px; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 2px; transition: color 0.3s ease; }
        .nav-links a:hover, .nav-links a.active { color: #ff0000; }
        
        /* Music Toggle Button */
        .music-toggle { 
            position: fixed; bottom: 30px; left: 30px; z-index: 100; font-size: 1.5rem; cursor: pointer; color: #ffffff; 
            background: rgba(20, 20, 20, 0.7); border: 1px solid #333; border-radius: 50%; width: 50px; height: 50px; 
            display: flex; justify-content: center; align-items: center; 
            transition: transform 0.3s ease, text-shadow 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease; 
            user-select: none; backdrop-filter: blur(5px); 
        }
        .music-toggle:hover { transform: scale(1.1); text-shadow: 0 0 10px rgba(255, 0, 0, 0.8); border-color: #ff0000; box-shadow: 0 0 15px rgba(255, 0, 0, 0.3); }
        
        

        .page-header { position: relative; z-index: 10; margin-top: 120px; text-align: center; padding: 20px 20px; }
        .page-header h1 { font-size: 3rem; color: #ff0000; text-transform: uppercase; letter-spacing: 10px; margin: 0; font-weight: 500; }
        .page-header p { color: #888888; letter-spacing: 3px; text-transform: uppercase; margin-top: 10px; margin-bottom: 30px; }
        
        /* Portfolio Categories */
        .portfolio-categories { position: relative; z-index: 10; display: flex; justify-content: center; gap: 15px; margin-bottom: 40px; flex-wrap: wrap; padding: 0 20px; }
        .portfolio-categories button { background: rgba(0,0,0,0.5); border: 1px solid #333; color: #fff; padding: 10px 25px; border-radius: 20px; cursor: pointer; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 2px; transition: all 0.3s ease; backdrop-filter: blur(5px); }
        .portfolio-categories button:hover, .portfolio-categories button.active { border-color: #ff0000; color: #ff0000; box-shadow: 0 0 15px rgba(255, 0, 0, 0.3); }

        .gallery-container { position: relative; z-index: 10; max-width: 1200px; margin: 0 auto 50px auto; padding: 0 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
        .gallery-item { position: relative; overflow: hidden; border-radius: 4px; aspect-ratio: 4 / 3; cursor: pointer; background-color: #111; transition: opacity 0.4s ease, transform 0.4s ease; display: block; }
        .gallery-item.hidden { display: none; opacity: 0; transform: scale(0.9); }
        .gallery-item img, .gallery-item video { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .gallery-item::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; box-shadow: inset 0 0 60px 20px #000000; pointer-events: none; transition: box-shadow 0.4s ease; z-index: 1; }
        .gallery-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 0, 0, 0.7); display: flex; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.4s ease; z-index: 2; }
        .gallery-overlay span { color: #ffffff; font-size: 1.2rem; letter-spacing: 4px; text-transform: uppercase; transform: translateY(20px); transition: transform 0.4s ease; font-weight: bold; text-align: center; padding: 10px; }
        .gallery-item:hover img, .gallery-item:hover video { transform: scale(1.1); }
        .gallery-item:hover::after { box-shadow: inset 0 0 0px 0px #000000; }
        .gallery-item:hover .gallery-overlay { opacity: 1; }
        .gallery-item:hover .gallery-overlay span { transform: translateY(0); }
    
        /* Mobile Responsiveness */
        @media (max-width: 850px) {
            nav { padding: 15px 0; flex-direction: column; gap: 15px; }
            .nav-links { margin-left: 0; width: 100%; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
            .nav-links a { margin: 0 8px; font-size: 0.9rem; }
            
            .page-header { margin-top: 150px; padding: 20px; }
            .page-header h1 { font-size: 2.2rem; }
            .portfolio-categories { gap: 10px; }
            .portfolio-categories button { padding: 8px 12px; font-size: 0.7rem; }
            .gallery-container { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); padding-bottom: 50px; }
            
            .music-toggle { bottom: 15px; left: 15px; width: 40px; height: 40px; font-size: 1.2rem; }
            .lightbox-close { top: 15px; right: 15px; font-size: 35px; }
            .lightbox-nav { font-size: 18px; padding: 10px 15px; }
            .lightbox-prev { left: 10px; }
            .lightbox-next { right: 10px; }
            .lightbox img, .lightbox video { max-width: 100vw; max-height: 100vh; width: 100%; height: 100%; object-fit: contain; border: none; border-radius: 0; box-shadow: none; }
            .lightbox-content { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; padding: 0; opacity: 0; transform: scale(0.9); transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
        .lightbox.active .lightbox-content { opacity: 1; transform: scale(1); }
            
        }
            #particleCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
    
        /* Lightbox Styles */
        .lightbox { display: none; position: fixed; z-index: 9999; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); justify-content: center; align-items: center; flex-direction: column; }
        .lightbox.active { display: flex; }
        .lightbox-content { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; padding: 0; opacity: 0; transform: scale(0.9); transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
        .lightbox.active .lightbox-content { opacity: 1; transform: scale(1); }
        .lightbox img, .lightbox video { max-width: 100vw; max-height: 100vh; width: 100%; height: 100%; object-fit: contain; border: none; border-radius: 0; box-shadow: none; }
        .lightbox-close { position: absolute; top: 20px; right: 30px; color: #fff; font-size: 40px; cursor: pointer; transition: color 0.3s; z-index: 10000; font-weight: bold; }
        .lightbox-close:hover { color: #ff0000; }
        .lightbox-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(20,20,20,0.6); color: #fff; border: 1px solid #ff0000; font-size: 24px; padding: 15px 20px; cursor: pointer; z-index: 10000; transition: all 0.3s; border-radius: 50%; }
        .lightbox-nav:hover { background: #ff0000; color: #000; }
        .lightbox-prev { left: 20px; }
        .lightbox-next { right: 20px; }
        .lightbox-counter { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); color: #fff; font-size: 1.2rem; letter-spacing: 2px; z-index: 10000; background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 20px; }

    
        .global-fullscreen { position: fixed; bottom: 30px; right: 30px; z-index: 100; font-size: 1.5rem; cursor: pointer; color: #ffffff; background: rgba(20, 20, 20, 0.7); border: 1px solid #333; border-radius: 50%; width: 50px; height: 50px; display: flex; justify-content: center; align-items: center; transition: all 0.3s ease; user-select: none; backdrop-filter: blur(5px); }
        .global-fullscreen:hover { transform: scale(1.1); text-shadow: 0 0 10px rgba(255, 0, 0, 0.8); border-color: #ff0000; box-shadow: 0 0 15px rgba(255, 0, 0, 0.3); }
        .lightbox-fullscreen { position: absolute; bottom: 30px; right: 30px; z-index: 10000; font-size: 1.5rem; cursor: pointer; color: #ffffff; background: rgba(20, 20, 20, 0.7); border: 1px solid #333; border-radius: 50%; width: 50px; height: 50px; display: flex; justify-content: center; align-items: center; transition: all 0.3s ease; user-select: none; backdrop-filter: blur(5px); }
        .lightbox-fullscreen:hover { transform: scale(1.1); text-shadow: 0 0 10px rgba(255, 0, 0, 0.8); border-color: #ff0000; box-shadow: 0 0 15px rgba(255, 0, 0, 0.3); }

        @media (max-width: 850px) {
            .global-fullscreen { bottom: 15px !important; right: 15px !important; left: auto !important; transform: none !important; width: 40px !important; height: 40px !important; font-size: 1.2rem !important; }
            .lightbox-fullscreen { top: auto !important; left: auto !important; bottom: 15px !important; right: 15px !important; width: 40px !important; height: 40px !important; font-size: 1.2rem !important; margin-top: 0 !important; }
        }
    </style>
</head>
<body>

    <!-- Lightbox Modal -->
    <div id="lightboxModal" class="lightbox">
        <span class="lightbox-fullscreen" id="lbFullscreenBtn" title="Toggle Photo Fullscreen">⛶</span>
        <span class="lightbox-close">&times;</span>
        <button class="lightbox-nav lightbox-prev">&#10094;</button>
        <div class="lightbox-content">
            <img id="lightboxImg" src="" alt="Gallery View">
            <video id="lightboxVideo" src="" controls style="display:none;"></video>
        </div>
        <button class="lightbox-nav lightbox-next">&#10095;</button>
        <div id="lightboxCounter" class="lightbox-counter"></div>
    </div>

    <canvas id="particleCanvas"></canvas>
    <!-- Audio element -->
    <audio id="bgMusic" loop src="music.mp3"></audio>
    <div class="music-toggle" id="musicToggleBtn" title="Play/Pause Music">🔇</div>
    <div class="global-fullscreen" id="globalFullscreenBtn" title="Toggle Website Fullscreen">⛶</div>
    
    <nav>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="booking.html">Booking</a>
            <a href="portfolio.html" class="active">Portfolio</a>
        </div>
    </nav>
    
    <div class="page-header">
        <h1>Collections</h1>
        <p>Our recent digital works</p>
    </div>

    <!-- Category Filters - Now functional -->
    <div class="portfolio-categories">
        <button class="active" data-filter="all">All</button>
        <button data-filter="wedding_album">Wedding Album</button>
        <button data-filter="photos">Photos</button>
        <button data-filter="videos">Videos</button>
    </div>

    <div class="gallery-container">
        <!-- 
          WEDDING ALBUMS:
          Change 'data-pages' to match EXACTLY how many photos you uploaded for that specific album.
          For example, if Wedding Album 1 has 50 photos in your GitHub, set data-pages="50".
          Name your files: wedding_album_1_1.jpg, wedding_album_1_2.jpg, etc.
        -->
        <div class="gallery-item" data-category="wedding_album" data-album-prefix="wedding_album_1_" data-pages="30">
            <img src="wedding_album_1_1.jpg" onerror="this.src='https://picsum.photos/600/400?random=1'" alt="Wedding Album 1">
            <div class="gallery-overlay"><span>Wedding Album 1</span></div>
        </div>
        <div class="gallery-item" data-category="wedding_album" data-album-prefix="wedding_album_2_" data-pages="45">
            <img src="wedding_album_2_1.jpg" onerror="this.src='https://picsum.photos/600/400?random=2'" alt="Wedding Album 2">
            <div class="gallery-overlay"><span>Wedding Album 2</span></div>
        </div>
        <div class="gallery-item" data-category="wedding_album" data-album-prefix="wedding_album_3_" data-pages="60">
            <img src="wedding_album_3_1.jpg" onerror="this.src='https://picsum.photos/600/400?random=3'" alt="Wedding Album 3">
            <div class="gallery-overlay"><span>Wedding Album 3</span></div>
        </div>
        
        <!-- PHOTOS PLACEHOLDERS -->
        <div class="gallery-item" data-category="photos">
            <img src="photo_1.jpg" onerror="this.src='https://picsum.photos/600/400?random=4'" alt="Photo 1">
            <div class="gallery-overlay"><span>Photo 1</span></div>
        </div>
        <div class="gallery-item" data-category="photos">
            <img src="photo_2.jpg" onerror="this.src='https://picsum.photos/600/400?random=5'" alt="Photo 2">
            <div class="gallery-overlay"><span>Photo 2</span></div>
        </div>
        <div class="gallery-item" data-category="photos">
            <img src="photo_3.jpg" onerror="this.src='https://picsum.photos/600/400?random=6'" alt="Photo 3">
            <div class="gallery-overlay"><span>Photo 3</span></div>
        </div>
        
        <!-- VIDEOS PLACEHOLDERS -->
        <div class="gallery-item" data-category="videos">
            <video src="video_1.mp4" autoplay loop muted playsinline poster="https://picsum.photos/600/400?random=7"></video>
            <div class="gallery-overlay"><span>Video 1</span></div>
        </div>
        <div class="gallery-item" data-category="videos">
            <video src="video_2.mp4" autoplay loop muted playsinline poster="https://picsum.photos/600/400?random=8"></video>
            <div class="gallery-overlay"><span>Video 2</span></div>
        </div>
        <div class="gallery-item" data-category="videos">
            <video src="video_3.mp4" autoplay loop muted playsinline poster="https://picsum.photos/600/400?random=9"></video>
            <div class="gallery-overlay"><span>Video 3</span></div>
        </div>
    </div>
    
    <script>
        // --- PORTFOLIO FILTER LOGIC ---
        const filterBtns = document.querySelectorAll('.portfolio-categories button');
        
        
        // --- GLOBAL FULLSCREEN LOGIC ---
        const globalFullscreenBtn = document.getElementById('globalFullscreenBtn');
        if (globalFullscreenBtn) {
            globalFullscreenBtn.addEventListener('click', () => {
                if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                    const elem = document.documentElement;
                    if (elem.requestFullscreen) elem.requestFullscreen().catch(err => console.log(err));
                    else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
                    globalFullscreenBtn.innerText = '⤢';
                } else {
                    if (document.exitFullscreen) document.exitFullscreen();
                    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                    globalFullscreenBtn.innerText = '⛶';
                }
            });
        }

        // --- LIGHTBOX LOGIC ---
        const lightbox = document.getElementById('lightboxModal');
        const lightboxImg = document.getElementById('lightboxImg');
        const lightboxVideo = document.getElementById('lightboxVideo');
        const lightboxClose = document.querySelector('.lightbox-close');
        const lightboxPrev = document.querySelector('.lightbox-prev');
        const lightboxNext = document.querySelector('.lightbox-next');
        const lightboxCounter = document.getElementById('lightboxCounter');
        const lbFullscreenBtn = document.getElementById('lbFullscreenBtn');

        let currentMedia = [];
        let currentIndex = 0;
        let isVideoMode = false;

        lightboxImg.onerror = function() {
            this.src = 'https://picsum.photos/800/600?text=Image+Not+Uploaded+Yet';
        };

        function openLightbox(index) {
            if(currentMedia.length === 0) return;
            currentIndex = index;
            const mediaSrc = currentMedia[currentIndex];
            
            const content = document.querySelector('.lightbox-content');
            
            // Smooth transition for changing images while lightbox is already open
            if(lightbox.classList.contains('active')) {
                content.style.opacity = '0';
                content.style.transform = 'scale(0.95)';
            }
            
            setTimeout(() => {
                if (isVideoMode) {
                    lightboxImg.style.display = 'none';
                    lightboxVideo.style.display = 'block';
                    lightboxVideo.src = mediaSrc;
                    lightboxVideo.play().catch(e=>console.log("Video missing"));
                } else {
                    lightboxVideo.style.display = 'none';
                    lightboxImg.style.display = 'block';
                    lightboxImg.src = mediaSrc; 
                }

                if (currentMedia.length > 1) {
                    lightboxPrev.style.display = 'block';
                    lightboxNext.style.display = 'block';
                    lightboxCounter.innerText = `${currentIndex + 1} / ${currentMedia.length}`;
                    lightboxCounter.style.display = 'block';
                } else {
                    lightboxPrev.style.display = 'none';
                    lightboxNext.style.display = 'none';
                    lightboxCounter.style.display = 'none';
                }

                if(!lightbox.classList.contains('active')) {
                    lightbox.classList.add('active');
                }
                
                requestAnimationFrame(() => {
                    content.style.opacity = '1';
                    content.style.transform = 'scale(1)';
                });
            }, lightbox.classList.contains('active') ? 200 : 0);
        }

        // Fullscreen Toggle
        lbFullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                const elem = document.documentElement;
                if (elem.requestFullscreen) {
                    elem.requestFullscreen().catch(err => console.log(err));
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                }
                lbFullscreenBtn.innerText = '⤢';
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
                lbFullscreenBtn.innerText = '⛶';
            }
        });

        function closeLightbox() {
            const content = document.querySelector('.lightbox-content');
            content.style.opacity = '0';
            content.style.transform = 'scale(0.9)';
            
            setTimeout(() => {
                lightbox.classList.remove('active');
                if (isVideoMode) lightboxVideo.pause();
                lightboxImg.src = '';
                lightboxVideo.src = '';
                
                if (document.fullscreenElement || document.webkitFullscreenElement) {
                    if (document.exitFullscreen) document.exitFullscreen().catch(e => console.log(e));
                    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                    lbFullscreenBtn.innerText = '⛶';
                }
            }, 300);
        }

        lightboxClose.addEventListener('click', closeLightbox);
        lightboxPrev.addEventListener('click', (e) => {
            e.stopPropagation();
            currentIndex = (currentIndex > 0) ? currentIndex - 1 : currentMedia.length - 1;
            openLightbox(currentIndex);
        });
        lightboxNext.addEventListener('click', (e) => {
            e.stopPropagation();
            currentIndex = (currentIndex < currentMedia.length - 1) ? currentIndex + 1 : 0;
            openLightbox(currentIndex);
        });

        // Keyboard Navigation
        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('active')) return;
            
            if (e.key === 'Escape') {
                closeLightbox();
            } else if (currentMedia.length > 1) {
                if (e.key === 'ArrowRight') {
                    currentIndex = (currentIndex < currentMedia.length - 1) ? currentIndex + 1 : 0;
                    openLightbox(currentIndex);
                } else if (e.key === 'ArrowLeft') {
                    currentIndex = (currentIndex > 0) ? currentIndex - 1 : currentMedia.length - 1;
                    openLightbox(currentIndex);
                }
            }
        });

        lightbox.addEventListener('click', (e) => {
            if(e.target === lightbox || e.target.classList.contains('lightbox-content')) closeLightbox();
        });

        const galleryItems = document.querySelectorAll('.gallery-item');
        
        // Gallery Item Clicks
        galleryItems.forEach(item => {
            item.addEventListener('click', () => {
                const category = item.getAttribute('data-category');
                currentMedia = [];
                
                if (category === 'wedding_album') {
                    isVideoMode = false;
                    const prefix = item.getAttribute('data-album-prefix'); 
                    const pages = parseInt(item.getAttribute('data-pages')) || 25;
                    for(let i = 1; i <= pages; i++) {
                        currentMedia.push(`${prefix}${i}.jpg`);
                    }
                    openLightbox(0);
                } 
                else if (category === 'videos') {
                    isVideoMode = true;
                    const videoSrc = item.querySelector('video').getAttribute('src');
                    currentMedia.push(videoSrc);
                    openLightbox(0);
                } 
                else {
                    isVideoMode = false;
                    const imgSrc = item.querySelector('img').getAttribute('src');
                    currentMedia.push(imgSrc);
                    openLightbox(0);
                }
            });
        });


        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                // Remove active class from all buttons
                filterBtns.forEach(b => b.classList.remove('active'));
                // Add active class to clicked button
                btn.classList.add('active');
                
                const filterValue = btn.getAttribute('data-filter');
                
                galleryItems.forEach(item => {
                    if (filterValue === 'all' || item.getAttribute('data-category') === filterValue) {
                        item.classList.remove('hidden');
                    } else {
                        item.classList.add('hidden');
                    }
                });
            });
        });

        
    

        // --- 3D PARTICLES SETUP (NO LINES, RANDOM SIZES/VELOCITY) ---
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];
        const fov = 250;
        let currentMultiplier = 1; let targetMultiplier = 1; 

        function resizeCanvas() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();

        class Node {
            constructor() {
                this.x = (Math.random() - 0.5) * width * 3;
                this.y = (Math.random() - 0.5) * height * 3;
                this.z = Math.random() * 1000;
                // Randomize velocity, magnitude, and size
                this.vz = -(Math.random() * 4 + 1.5); // Faster z-speed
                this.vx = (Math.random() - 0.5) * 6; // Random drift
                this.vy = (Math.random() - 0.5) * 6; // Random drift
                this.size = Math.random() * 2.5 + 0.5; // Random size
                this.x2d = 0; this.y2d = 0; this.scale = 0;
            }
            update() {
                this.z += this.vz * currentMultiplier; 
                this.x += this.vx * currentMultiplier; 
                this.y += this.vy * currentMultiplier;
                
                if (this.z <= 0) { 
                    this.z = 1000; 
                    this.x = (Math.random() - 0.5) * width * 3; 
                    this.y = (Math.random() - 0.5) * height * 3; 
                    // Re-randomize on loop
                    this.vz = -(Math.random() * 4 + 1.5);
                    this.vx = (Math.random() - 0.5) * 6;
                    this.vy = (Math.random() - 0.5) * 6;
                    this.size = Math.random() * 2.5 + 0.5;
                }
                
                if (this.x < -width * 1.5 || this.x > width * 1.5) this.vx *= -1;
                if (this.y < -height * 1.5 || this.y > height * 1.5) this.vy *= -1;
                
                this.scale = fov / (fov + this.z);
                this.x2d = (this.x * this.scale) + (width / 2);
                this.y2d = (this.y * this.scale) + (height / 2);
            }
            draw() {
                const r = this.size * this.scale * 2; 
                const opacity = 1 - (this.z / 1000);
                ctx.beginPath(); 
                ctx.arc(this.x2d, this.y2d, Math.max(r, 0.1), 0, Math.PI * 2);
                
                ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`; 
                ctx.fill();
            }
        }
        
        for (let i = 0; i < 350; i++) { particles.push(new Node()); }
        
        function animate() {
            currentMultiplier += (targetMultiplier - currentMultiplier) * 0.05;
            ctx.clearRect(0, 0, width, height); // Fully clear frame (no motion blur, runs smooth)
            particles.forEach(p => p.update());
            particles.forEach(p => p.draw());
            requestAnimationFrame(animate);
        }
        animate();

        
        let warpTimeout;
        window.addEventListener('click', (e) => {
            if (e.target.closest('nav') || e.target.closest('.music-toggle') || e.target.closest('.glass-panel') || e.target.closest('.gallery-item') || e.target.closest('.portfolio-categories') || e.target.closest('.action-btn') || e.target.closest('.lightbox') || e.target.closest('.global-fullscreen')) return;
            targetMultiplier = 12;
            clearTimeout(warpTimeout);
            warpTimeout = setTimeout(() => { targetMultiplier = 1; }, 600);
        });

    </script>
</body>
</html>
