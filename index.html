<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZOOM Studio - Home</title>
    <style>
        body { 
            background-color: #000000; 
            margin: 0; 
            padding: 0; 
            font-family: 'Arial', sans-serif; 
            overflow-x: hidden; 
            overflow-y: auto; 
        }
        
        nav { position: fixed; top: 0; width: 100%; padding: 20px 0; text-align: center; background-color: rgba(10, 10, 10, 0.8); border-bottom: 1px solid #222222; display: flex; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(5px); }
        
        .location-container { position: absolute; left: 30px; display: flex; align-items: center; cursor: pointer; }
        .location-pin { color: #ff0000; font-size: 1.2rem; z-index: 2; transition: transform 0.3s ease; }
        .location-text { color: #ffffff; font-size: 1rem; letter-spacing: 1px; max-width: 0; overflow: hidden; white-space: nowrap; transition: max-width 0.4s ease, margin-left 0.4s ease; margin-left: 0; }
        .location-container:hover .location-text { max-width: 150px; margin-left: 8px; }
        .location-container:hover .location-pin { transform: scale(1.2); }
        
        .nav-links { display: inline-block; transition: opacity 0.4s ease; margin-left: -50px; }
        .nav-links.hidden { opacity: 0; pointer-events: none; }
        nav a { color: #ffffff; text-decoration: none; margin: 0 20px; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 2px; transition: color 0.3s ease, text-shadow 0.3s ease; cursor: pointer; }
        nav a:hover, nav a.active { color: #ff0000; text-shadow: 0 0 10px rgba(255,0,0,0.5); }
        
        .search-container { position: absolute; right: 30px; display: flex; justify-content: flex-end; align-items: center; gap: 20px; }
        .search-input { background-color: transparent; border: 1px solid #ffffff; color: #ffffff; padding: 5px 10px; width: 100px; transition: all 0.4s ease; outline: none; border-radius: 4px; text-align: left; cursor: pointer; }
        .search-input:focus { width: 200px; border-color: #ff0000; box-shadow: 0 0 10px rgba(255,0,0,0.3); }
        
        /* Fixed Music Toggle Button (Bottom Left) */
        .music-toggle { 
            position: fixed;
            bottom: 30px;
            left: 30px;
            z-index: 100;
            font-size: 1.5rem; 
            cursor: pointer; 
            color: #ffffff; 
            background: rgba(20, 20, 20, 0.7);
            border: 1px solid #333;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s ease, text-shadow 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease; 
            user-select: none; 
            backdrop-filter: blur(5px);
        }
        .music-toggle:hover { 
            transform: scale(1.1); 
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.8); 
            border-color: #ff0000;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
        }
        
        .hero-section { height: 100vh; width: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; z-index: 10; pointer-events: none; }
        .logo { font-family: 'Arial', sans-serif; font-size: 8rem; font-weight: 500; color: #ff0000; text-transform: uppercase; letter-spacing: 5px; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: transform 0.3s ease, text-shadow 0.3s ease; -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%); mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%); pointer-events: auto; }
        .logo:hover { transform: scale(1.1); text-shadow: 0 0 25px rgba(255, 0, 0, 0.9); }
        .logo span { display: inline-block; }
        .o-one { transform: scaleX(1.4); z-index: 2; }
        .o-two { margin-left: -40px; opacity: 0.9; z-index: 1; }
        
        .subtitle { 
            color: #ffffff; 
            font-size: 1.2rem; 
            letter-spacing: 8px; 
            text-transform: uppercase; 
            margin-top: 20px; 
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.6); 
            cursor: pointer;
            pointer-events: auto;
            transition: text-shadow 0.3s ease, transform 0.2s ease;
        }
        .subtitle:hover {
            text-shadow: 0 0 20px rgba(255, 255, 255, 1);
            transform: scale(1.02);
        }
        .subtitle:active {
            transform: scale(0.98);
            text-shadow: 0 0 30px rgba(255, 255, 255, 1);
        }
        
        /* Action Buttons */
        .action-buttons { 
            margin-top: 30px; 
            display: flex; 
            gap: 30px; 
            pointer-events: auto; 
            z-index: 20;
        }
        .action-btn { 
            position: relative; 
            padding: 15px 40px; 
            color: #ffffff; 
            font-size: 1.1rem; 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            text-decoration: none; 
            background: rgba(20, 20, 20, 0.4); 
            border: 1px solid rgba(255, 0, 0, 0.5); /* Slight red border */ 
            border-radius: 4px; 
            backdrop-filter: blur(10px); 
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94); 
            overflow: hidden; 
        }
        .action-btn::before { 
            content: ''; 
            position: absolute; 
            top: 0; left: -100%; 
            width: 100%; height: 100%; 
            background: linear-gradient(90deg, transparent, rgba(255,0,0,0.4), transparent); 
            transition: left 0.5s ease; 
        }
        .action-btn:hover { 
            transform: translateY(-5px) scale(1.05); 
            border-color: #ff0000; 
            box-shadow: 0 10px 30px rgba(255, 0, 0, 0.3); 
            color: #ff0000; 
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.8); 
        }
        .action-btn:hover::before { 
            left: 100%; 
            transition: left 0.5s ease; 
        }
        
        @keyframes blinkRed { 
            0%, 100% { color: #ff0000; text-shadow: 0 0 30px #ff0000, 0 0 60px #ff0000; opacity: 1; } 
            50% { color: #440000; text-shadow: none; opacity: 0.4; } 
        }
        .blink { animation: blinkRed 0.15s infinite; }

        .scroll-indicator { position: absolute; bottom: 40px; color: #ff0000; letter-spacing: 4px; font-size: 0.9rem; text-transform: uppercase; animation: bounce 2s infinite; pointer-events: auto; cursor: pointer; transition: text-shadow 0.3s ease, color 0.3s ease; }
        .scroll-indicator:hover { text-shadow: 0 0 10px #ff0000; }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-15px); } 60% { transform: translateY(-7px); } }

        .scroll-section { position: relative; height: 350vh; z-index: 20; background-color: transparent; }
        .sticky-wrapper { position: sticky; top: 0; height: 100vh; width: 100%; overflow: hidden; display: flex; justify-content: center; align-items: center; background-color: #000; box-shadow: 0 -20px 50px #000; }
        
        .reveal-image { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('https://picsum.photos/1920/1080?random=100'); background-size: cover; background-position: center; transition: transform 0.2s ease-out, background-position 0.1s ease-out; display: flex; justify-content: center; align-items: center; opacity: 0; will-change: transform, opacity, background-position; }
        
        .reveal-image::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; box-shadow: inset 0 0 150px 80px #000000; z-index: 1; pointer-events: none; }
        
        .image-title { position: relative; z-index: 2; font-size: 4rem; color: #ffffff; text-transform: uppercase; letter-spacing: 15px; text-shadow: 0 10px 40px rgba(0,0,0,0.9); font-weight: bold; text-align: center; }
        .image-title span { display: block; font-size: 1.5rem; color: #ff0000; letter-spacing: 5px; margin-top: 15px; font-weight: normal; }
        
        .grid-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: grid; z-index: 3; pointer-events: none; }
        
        .grid-piece { background-color: #000; transition: opacity 0.5s ease, transform 0.6s ease-out, background-color 0.3s ease; border: 1px solid rgba(255, 0, 0, 0.05); transform-origin: center; will-change: opacity, transform; pointer-events: auto; }
        .grid-piece:hover:not(.shattered) { background-color: rgba(255, 0, 0, 0.15); }
        .grid-piece.shattered { opacity: 0; transform: scale(0.3); pointer-events: none; }
    
        /* Mobile Responsiveness */
        @media (max-width: 850px) {
            nav { padding: 15px 0; flex-direction: column; gap: 15px; }
            .location-container { position: relative; left: auto; top: auto; justify-content: center; }
            .search-container { position: relative; right: auto; top: auto; justify-content: center; }
            .nav-links { margin-left: 0; width: 100%; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
            .nav-links a { margin: 0 8px; font-size: 0.9rem; }
            .search-input { width: 80px; }
            .search-input:focus { width: 150px; }
            
            .logo { font-size: 4rem; letter-spacing: 2px; }
            .logo .o-two { margin-left: -20px; }
            .subtitle { font-size: 0.8rem; letter-spacing: 3px; text-align: center; padding: 0 10px; }
            .image-title { font-size: 2rem; letter-spacing: 3px; }
            .image-title span { font-size: 1rem; margin-top: 10px; }
            
            .action-buttons { flex-direction: column; gap: 15px; margin-top: 25px; }
            .action-btn { padding: 12px 30px; font-size: 1rem; width: 100%; text-align: center; box-sizing: border-box; }
            
            .about-container { flex-direction: column; height: auto; padding-top: 200px; text-align: center; gap: 30px; }
            .about-text { padding-right: 0; }
            .about-text h1 { font-size: 2.5rem; margin-bottom: 15px; }
            .about-image { width: 100%; height: 40vh; margin-bottom: 50px; }
            
            .booking-wrapper { margin-top: 200px; gap: 20px; padding-bottom: 50px; }
            .glass-panel { padding: 25px 15px; box-sizing: border-box; width: 100%; min-width: unset; }
            .glass-panel h2 { font-size: 1.5rem; text-align: center; }
            .info-item { flex-direction: column; align-items: center; text-align: center; padding: 15px 10px; }
            .info-icon { margin-right: 0; margin-bottom: 10px; }
            
            .modal-content { max-width: 90%; padding: 25px; box-sizing: border-box; }
            
            .page-header { margin-top: 200px; padding: 20px; }
            .page-header h1 { font-size: 2.2rem; }
            .portfolio-categories { gap: 10px; }
            .portfolio-categories button { padding: 8px 12px; font-size: 0.7rem; }
            .gallery-container { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); padding-bottom: 50px; }
            
            .music-toggle { bottom: 15px; left: 15px; width: 40px; height: 40px; font-size: 1.2rem; }
            .scroll-indicator { font-size: 0.75rem; bottom: 20px; width: 100%; text-align: center; left: 0; }
        }

            #particleCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
    </style>
</head>
<body>
    <canvas id="particleCanvas"></canvas>
    <!-- Audio element for background music -->
    <audio id="bgMusic" loop src="music.mp3"></audio>
    
    <!-- Floating Music Toggle Button -->
    <div class="music-toggle" id="musicToggleBtn" title="Play/Pause Music">🔇</div>
    
    <nav>
        <div class="location-container" id="locationBtn">
            <span class="location-pin">📍</span>
            <span class="location-text">Studio Location</span>
        </div>
        <div class="nav-links" id="navLinks">
            <a href="index.html" class="active">Home</a>
            <a href="about.html">About</a>
            <a href="booking.html">Booking</a>
            <a href="portfolio.html">Portfolio</a>
        </div>
        <div class="search-container">
            <input type="text" placeholder="Search..." class="search-input" id="searchInput">
        </div>
    </nav>
    
    <div class="hero-section">
        <div class="logo" id="zoomLogo">
            <span>Z</span><span class="o-one">O</span><span class="o-two">O</span><span>M</span>
        </div>
        <div class="subtitle" id="zoomSubtitle">High tech digital studio</div>
        <div class="action-buttons">
            <a href="booking.html" class="action-btn">Booking</a>
            <a href="portfolio.html" class="action-btn">Gallery</a>
        </div>
        <div class="scroll-indicator" id="scrollIndicator">↓ Scroll to Initiate ↓</div>
    </div>

    <div id="scrollSection" class="scroll-section">
        <div class="sticky-wrapper">
            <div id="revealImage" class="reveal-image">
                <div class="image-title">Virtual Production<span>The Next Frontier</span></div>
            </div>
            <div id="gridOverlay" class="grid-overlay"></div>
        </div>
    </div>

    <script>
        const logo = document.getElementById('zoomLogo');
        const subtitle = document.getElementById('zoomSubtitle');
        const scrollIndicator = document.getElementById('scrollIndicator');
        const searchInput = document.getElementById('searchInput');
        const navLinks = document.getElementById('navLinks');
        const locationBtn = document.getElementById('locationBtn');
        const scrollSection = document.getElementById('scrollSection');
        const revealImage = document.getElementById('revealImage');
        const bgMusic = document.getElementById('bgMusic');
        const musicToggleBtn = document.getElementById('musicToggleBtn');
        
        let isMusicPlaying = false;
        
        // Music Toggle Logic
        musicToggleBtn.addEventListener('click', () => {
            if (isMusicPlaying) {
                bgMusic.pause();
                musicToggleBtn.innerText = '🔇';
                musicToggleBtn.style.color = '#ffffff';
                musicToggleBtn.style.borderColor = '#333';
            } else {
                bgMusic.play().catch(e => console.log("Audio play failed (user interaction needed)"));
                musicToggleBtn.innerText = '🔊';
                musicToggleBtn.style.color = '#ff0000';
                musicToggleBtn.style.borderColor = '#ff0000';
            }
            isMusicPlaying = !isMusicPlaying;
        });

        searchInput.addEventListener('focus', () => { navLinks.classList.add('hidden'); });
        searchInput.addEventListener('blur', () => { navLinks.classList.remove('hidden'); });
        
        locationBtn.addEventListener('click', () => { 
            window.location.href = 'booking.html'; 
        });

        // 2. Scroll half-way via indicator click
        function scrollToHalfway() {
            const totalScroll = scrollSection.offsetHeight - window.innerHeight;
            const halfScrollTarget = scrollSection.offsetTop + (totalScroll / 2);
            
            window.scrollTo({
                top: halfScrollTarget,
                behavior: 'smooth'
            });
        }
        scrollIndicator.addEventListener('click', scrollToHalfway);

        // 1. ZOOM Logo Event (Now scrolls fully to the end)
        let warpTimeout;
        let messageTimeout;
        const originalScrollText = scrollIndicator.innerText;

        logo.addEventListener('click', () => {
            logo.classList.add('blink');
            targetMultiplier = 12;
            scrollIndicator.innerText = "SCROLL FOR A SEC!";
            scrollIndicator.style.color = "#ffffff";
            scrollIndicator.style.textShadow = "0 0 15px #ffffff";
            
            clearTimeout(warpTimeout);
            clearTimeout(messageTimeout);
            
            warpTimeout = setTimeout(() => { 
                logo.classList.remove('blink');
                targetMultiplier = 1;
            }, 600);
            
            messageTimeout = setTimeout(() => {
                scrollIndicator.innerText = originalScrollText;
                scrollIndicator.style.color = "#ff0000";
                scrollIndicator.style.textShadow = "none";
            }, 2000);
            
            // FULL SCROLL to the end of the reveal section
            const fullScrollTarget = scrollSection.offsetTop + scrollSection.offsetHeight;
            window.scrollTo({
                top: fullScrollTarget,
                behavior: 'smooth'
            });
        });

        // Subtitle Events
        let subtitleTimeout;
        subtitle.addEventListener('click', () => {
            targetMultiplier = 12;
            clearTimeout(subtitleTimeout);
            subtitleTimeout = setTimeout(() => {
                targetMultiplier = 1;
            }, 400); // exactly 0.4s
        });

        // --- SCROLL REVEAL GRID LOGIC ---
        const gridOverlay = document.getElementById('gridOverlay');
        const cols = window.innerWidth > 800 ? 24 : 12; 
        const rows = window.innerHeight > 800 ? 18 : 12;
        const totalPieces = cols * rows;

        gridOverlay.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
        gridOverlay.style.gridTemplateRows = `repeat(${rows}, 1fr)`;

        let thresholds = [];
        for(let i=0; i<totalPieces; i++) thresholds.push((i / totalPieces) * 0.85); 
        thresholds.sort(() => Math.random() - 0.5); 

        const pieces = [];
        for (let i = 0; i < totalPieces; i++) {
            const piece = document.createElement('div');
            piece.classList.add('grid-piece');
            piece.dataset.threshold = thresholds[i];
            gridOverlay.appendChild(piece);
            pieces.push(piece);
        }

        let ticking = false;
        window.addEventListener('scroll', () => {
            if (!ticking) {
                window.requestAnimationFrame(() => {
                    handleScroll();
                    ticking = false;
                });
                ticking = true;
            }
        });

        function handleScroll() {
            const rect = scrollSection.getBoundingClientRect();
            let progress = 0;
            
            if (rect.top <= 0) {
                let scrolledPast = -rect.top;
                let totalScroll = rect.height - window.innerHeight;
                progress = scrolledPast / totalScroll;
            }

            progress = Math.max(0, Math.min(1, progress));

            revealImage.style.opacity = Math.min(1, progress * 2.5);
            revealImage.style.transform = `scale(${1 + progress * 0.10})`; 

            pieces.forEach(piece => {
                if (progress > parseFloat(piece.dataset.threshold)) {
                    piece.classList.add('shattered');
                } else {
                    piece.classList.remove('shattered');
                }
            });
        }

        
    

        // --- 3D PARTICLES SETUP (NO LINES, RANDOM SIZES/VELOCITY) ---
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];
        const fov = 250;
        let currentMultiplier = 1; let targetMultiplier = 1; 

        function resizeCanvas() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();

        class Node {
            constructor() {
                this.x = (Math.random() - 0.5) * width * 3;
                this.y = (Math.random() - 0.5) * height * 3;
                this.z = Math.random() * 1000;
                // Randomize velocity, magnitude, and size
                this.vz = -(Math.random() * 4 + 1.5); // Faster z-speed
                this.vx = (Math.random() - 0.5) * 6; // Random drift
                this.vy = (Math.random() - 0.5) * 6; // Random drift
                this.size = Math.random() * 2.5 + 0.5; // Random size
                this.x2d = 0; this.y2d = 0; this.scale = 0;
            }
            update() {
                this.z += this.vz * currentMultiplier; 
                this.x += this.vx * currentMultiplier; 
                this.y += this.vy * currentMultiplier;
                
                if (this.z <= 0) { 
                    this.z = 1000; 
                    this.x = (Math.random() - 0.5) * width * 3; 
                    this.y = (Math.random() - 0.5) * height * 3; 
                    // Re-randomize on loop
                    this.vz = -(Math.random() * 4 + 1.5);
                    this.vx = (Math.random() - 0.5) * 6;
                    this.vy = (Math.random() - 0.5) * 6;
                    this.size = Math.random() * 2.5 + 0.5;
                }
                
                if (this.x < -width * 1.5 || this.x > width * 1.5) this.vx *= -1;
                if (this.y < -height * 1.5 || this.y > height * 1.5) this.vy *= -1;
                
                this.scale = fov / (fov + this.z);
                this.x2d = (this.x * this.scale) + (width / 2);
                this.y2d = (this.y * this.scale) + (height / 2);
            }
            draw() {
                const r = this.size * this.scale * 2; 
                const opacity = 1 - (this.z / 1000);
                ctx.beginPath(); 
                ctx.arc(this.x2d, this.y2d, Math.max(r, 0.1), 0, Math.PI * 2);
                
                ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`; 
                ctx.fill();
            }
        }
        
        for (let i = 0; i < 350; i++) { particles.push(new Node()); }
        
        function animate() {
            currentMultiplier += (targetMultiplier - currentMultiplier) * 0.05;
            ctx.clearRect(0, 0, width, height); // Fully clear frame (no motion blur, runs smooth)
            particles.forEach(p => p.update());
            particles.forEach(p => p.draw());
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
